[package]
name = "vornokia-desktop"
version = "0.1.0"
description = "Vornokia desktop assistant"
authors = ["NexoraTech"]
edition = "2021"

[lib]
name = "vornokia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4", "serde"] }
